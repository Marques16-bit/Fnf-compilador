name: Build
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'assets/**', 'index.html']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: App version, empty keeps the default
        required: false
        default: ''
        type: string

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: ${{ inputs.version }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew :composeApp:desktopTest
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: composeApp/build/reports/tests/desktopTest

  android:
    name: Android APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew :composeApp:assembleRelease ${APP_VERSION:+-PappVersion=$APP_VERSION}
      - uses: actions/upload-artifact@v4
        with:
          name: FnfCompiler-android-apk
          path: composeApp/build/outputs/apk/release/*.apk

  desktop:
    name: Desktop ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            artifact: FnfCompiler-windows
            path: |
              composeApp/build/compose/binaries/main/msi/*.msi
              composeApp/build/compose/binaries/main/exe/*.exe
          - os: macos-latest
            name: macOS
            artifact: FnfCompiler-macos
            path: composeApp/build/compose/binaries/main/dmg/*.dmg
          - os: ubuntu-latest
            name: Linux
            artifact: FnfCompiler-linux
            path: composeApp/build/compose/binaries/main/deb/*.deb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
      - if: runner.os != 'Windows'
        run: chmod +x gradlew
      - run: ./gradlew :composeApp:packageDistributionForCurrentOS ${APP_VERSION:+-PappVersion=$APP_VERSION}
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}

  ios:
    name: iOS IPA
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: brew install xcodegen
      - name: Build IPA
        working-directory: iosApp
        run: |
          VERSION="${APP_VERSION:-1.0.0}"
          xcodegen generate
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$VERSION" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/FnfCompiler.app Payload/
          zip -qry FnfCompiler.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: FnfCompiler-ios-ipa
          path: iosApp/FnfCompiler.ipa
