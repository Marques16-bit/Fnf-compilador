name: Build Mod
run-name: Build ${{ inputs.target }} ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag that receives the result and optionally holds mod.zip
        required: true
        type: string
      target:
        description: Platform to build
        required: true
        default: android
        type: choice
        options: [android, ios, windows, macos, linux]
      source_repo:
        description: Public GitHub repository to build instead of mod.zip, as owner/name
        required: false
        default: ''
        type: string
      source_ref:
        description: Branch or tag of the repository
        required: false
        default: ''
        type: string
      haxe_version:
        description: Haxe version
        required: false
        default: 4.3.4
        type: string
      defines:
        description: Extra Haxe defines separated by spaces
        required: false
        default: ''
        type: string
      toolchain:
        description: Android toolchain generation
        required: false
        default: modern
        type: choice
        options: [modern, legacy]
      recipe:
        description: Build recipe, vslice is for FunkinCrew/Funkin
        required: false
        default: generic
        type: choice
        options: [generic, vslice]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ inputs.target == 'windows' && 'windows-latest' || (inputs.target == 'macos' || inputs.target == 'ios') && 'macos-15' || 'ubuntu-latest' }}
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      TARGET: ${{ inputs.target }}
      SOURCE_REPO: ${{ inputs.source_repo }}
      SOURCE_REF: ${{ inputs.source_ref }}
      DEFINES: ${{ inputs.defines }}
      RECIPE: ${{ inputs.recipe }}
    steps:
      - if: inputs.recipe == 'vslice' && runner.os == 'Linux'
        name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL

      - name: Get the source
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --title "$TAG" --notes ""
          if [ -n "$SOURCE_REPO" ]; then
            if [ -n "$SOURCE_REF" ]; then
              git clone --depth 1 --branch "$SOURCE_REF" "https://github.com/$SOURCE_REPO.git" mod
            else
              git clone --depth 1 "https://github.com/$SOURCE_REPO.git" mod
            fi
            if [ -f mod/.gitmodules ]; then
              git -C mod submodule update --init --recursive --depth 1
            fi
          else
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern mod.zip --dir .
            gh release delete-asset "$TAG" mod.zip --repo "$GITHUB_REPOSITORY" --yes
            mkdir mod
            if [ "$RUNNER_OS" = "Windows" ]; then 7z x mod.zip -omod -y > /dev/null; else unzip -q mod.zip -d mod; fi
          fi
          XML=$(find mod ( -name Project.xml -o -name project.hxp ) -not -path '*/.git/*' | awk '{ print length, $0 }' | sort -n | head -1 | cut -d' ' -f2-)
          test -n "$XML"
          echo "MOD_DIR=$(cd "$(dirname "$XML")" && pwd)" >> "$GITHUB_ENV"
          echo "PROJECT_FILE=$(basename "$XML")" >> "$GITHUB_ENV"

      - name: Patch Project.xml
        run: |
          cd "$MOD_DIR"
          if [ "$PROJECT_FILE" != "Project.xml" ]; then
            echo "Using $PROJECT_FILE, nothing to patch"
            exit 0
          fi
          patch_xml() {
            INSERT="$1" perl -0pi -e 's#</project>#$ENV{INSERT}\n</project>#i' Project.xml
          }
          if [ "$TARGET" = "android" ] || [ "$TARGET" = "ios" ]; then
            perl -0pi -e 's#(<define\s+name="DISCORD_ALLOWED"\s*)/>#$1unless="mobile" />#g' Project.xml
          fi
          if [ "$TARGET" = "android" ] && ! grep -q "target-sdk-version" Project.xml; then
            patch_xml "$(printf '\t<android target-sdk-version="29" minimum-sdk-version="21" />\n\t<config:android permission="android.permission.WRITE_EXTERNAL_STORAGE" />\n\t<config:android permission="android.permission.READ_EXTERNAL_STORAGE" />')"
          fi
          if [ "$TARGET" = "ios" ] && ! grep -Eq "<ios[[:space:]]" Project.xml; then
            patch_xml "$(printf '\t<ios deployment="12.0" />')"
          fi

      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ inputs.haxe_version }}

      - if: inputs.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.toolchain == 'modern' && '17' || '11' }}

      - if: inputs.target == 'android'
        uses: android-actions/setup-android@v3

      - if: inputs.target == 'android' && inputs.recipe == 'vslice'
        name: Install the Android NDK required by V-Slice
        run: |
          sdkmanager --install "build-tools;35.0.0" "ndk;29.0.13113456" "platforms;android-29" "platforms;android-35"
          echo "NDK_PATH=$ANDROID_HOME/ndk/29.0.13113456" >> "$GITHUB_ENV"

      - if: inputs.target == 'android' && inputs.recipe != 'vslice'
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ inputs.toolchain == 'modern' && 'r21e' || 'r15c' }}

      - if: inputs.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libx11-dev libxi-dev libxext-dev libxinerama-dev libxrandr-dev libgl-dev libgl1-mesa-dev libasound2-dev libpulse-dev libvlc-dev libvlccore-dev
          sudo apt-get install -y libvlccore9 || true

      - name: Install dependencies
        run: |
          HAXELIB_DIR="$HOME/haxelib"
          if [ "$RUNNER_OS" = "Windows" ]; then HAXELIB_DIR="C:/haxelib"; fi
          mkdir -p "$HAXELIB_DIR"
          haxelib setup "$HAXELIB_DIR"
          cd "$MOD_DIR"
          if [ "$RECIPE" = "vslice" ]; then
            haxelib --never --global install haxelib 4.1.0 || true
            haxelib --global set haxelib 4.1.0 || true
            haxelib --never --global git haxelib https://github.com/FunkinCrew/haxelib.git funkin-patches --skip-dependencies
            haxelib --never --global git hmm https://github.com/FunkinCrew/hmm funkin-patches
            haxelib --never newrepo
            haxelib --global run hmm install -q
            (cd .haxelib/hxcpp/git/tools/hxcpp && haxe compile.hxml)
          else
            haxelib install hxcpp
            if [ -f hmm.json ]; then
              haxelib install hmm
              haxelib run hmm install
            elif [ -f setup/unix.sh ] || [ -f setup/windows.bat ]; then
              SAFE='^haxelib (install|git|set) [A-Za-z0-9._@:/ =+-]+$'
              for script in setup/unix.sh setup/windows.bat; do
                if [ -f "$script" ]; then
                  tr -d '\r' < "$script" | grep -E "$SAFE" | grep -v -E '^haxelib set ' | while read -r line; do
                    echo "> $line"
                    $line < /dev/null || echo "Command failed: $line"
                  done
                  break
                fi
              done
              if [ -f setup/windows.bat ]; then
                tr -d '\r' < setup/windows.bat | grep -E '^haxelib set [A-Za-z0-9._-]+ [A-Za-z0-9._-]+$' | while read -r line; do
                  $line < /dev/null || true
                done
              fi
            elif [ -f Project.xml ]; then
              grep -oE '<haxelib name="[^"]+"( version="[^"]+")?' Project.xml | sed -E 's/<haxelib name="([^"]+)"( version="([^"]+)")?/\1 \3/' | sort -u | while read -r name version; do
                haxelib install "$name" $version < /dev/null || echo "Could not install $name"
              done
            fi
          fi
          if [ "$RECIPE" = "vslice" ]; then
            haxelib --always run lime setup
          else
            haxelib run lime setup -y
          fi
          if [ "$TARGET" = "android" ]; then
            haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
            haxelib run lime config ANDROID_NDK_ROOT "${NDK_PATH:-${{ steps.ndk.outputs.ndk-path }}}"
            haxelib run lime config JAVA_HOME "$JAVA_HOME"
            haxelib run lime config ANDROID_SETUP true
          fi
          haxelib list

      - name: Rebuild native libraries
        if: inputs.recipe == 'vslice'
        run: |
          cd "$MOD_DIR"
          LIME_TARGET="$TARGET"
          if [ "$TARGET" = "macos" ]; then LIME_TARGET="mac"; fi
          haxelib run lime rebuild hxcpp
          haxelib run lime rebuild "$LIME_TARGET"

      - name: Prepare environment file
        if: inputs.recipe == 'vslice'
        run: |
          cd "$MOD_DIR"
          if [ "$TARGET" = "android" ]; then
            keytool -genkeypair -keystore "$PWD/signing.jks" -alias key -storepass android -keypass android -dname "CN=FNF Compiler" -keyalg RSA -keysize 2048 -validity 10000
            printf 'KEYSTORE_PATH=%s\nKEYSTORE_ALIAS=key\nKEYSTORE_PASSWORD=android\n' "$PWD/signing.jks" > .env
          else
            touch .env
          fi

      - name: Build
        run: |
          cd "$MOD_DIR"
          LIME_TARGET="$TARGET"
          if [ "$TARGET" = "macos" ]; then LIME_TARGET="mac"; fi
          FLAGS="-final"
          if [ "$RECIPE" = "vslice" ]; then FLAGS="-release"; fi
          if [ "$TARGET" = "ios" ]; then FLAGS="$FLAGS -nosign"; fi
          for define in $DEFINES; do FLAGS="$FLAGS -D $define"; done
          haxelib run lime build "$LIME_TARGET" $FLAGS 2>&1 | tee build.log

      - name: Package
        run: |
          OUT="$GITHUB_WORKSPACE/out"
          mkdir -p "$OUT"
          cd "$MOD_DIR"
          case "$TARGET" in
            android)
              APK=$(find export/release/android -name '*.apk' | head -1)
              test -n "$APK"
              if echo "$APK" | grep -q unsigned; then
                BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
                keytool -genkeypair -keystore signing.jks -alias key -storepass android -keypass android -dname "CN=FNF Compiler" -keyalg RSA -keysize 2048 -validity 10000
                "$BT/zipalign" -f 4 "$APK" aligned.apk
                "$BT/apksigner" sign --ks signing.jks --ks-pass pass:android --key-pass pass:android --out "$OUT/result-android.apk" aligned.apk
              else
                cp "$APK" "$OUT/result-android.apk"
              fi
              ;;
            ios)
              APP=$(find export/release/ios -path '*iphoneos*' -name '*.app' -type d | head -1)
              if [ -z "$APP" ]; then APP=$(find export/release/ios -name '*.app' -type d | head -1); fi
              test -n "$APP"
              mkdir Payload
              cp -R "$APP" Payload/
              zip -qry "$OUT/result-ios.ipa" Payload
              ;;
            *)
              cd "export/release/$TARGET/bin"
              if [ "$RUNNER_OS" = "Windows" ]; then 7z a -tzip "$OUT/result-$TARGET.zip" ./* > /dev/null; else zip -qry "$OUT/result-$TARGET.zip" .; fi
              ;;
          esac

      - name: Publish result
        run: gh release upload "$TAG" out/result-* --repo "$GITHUB_REPOSITORY" --clobber

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ inputs.target }}
          path: ${{ env.MOD_DIR }}/build.log
          if-no-files-found: ignore
